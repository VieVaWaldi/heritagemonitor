name: heritagemonitor

services:
  # Builds every pure-TS workspace library (shared, db, search, search2) once
  # and keeps rebuilding on change (tsc --watch each). api and web only ever
  # import their compiled dist/ output, never src/ directly — see
  # infra/README.md's Docker Gotchas for why db/search need this too, not
  # just shared.
  libs:
    build:
      context: ..
      dockerfile: infra/Dockerfile.libs
    container_name: hm-libs
    restart: unless-stopped
    volumes:
      - ../packages/shared:/app/packages/shared
      - ../packages/db:/app/packages/db
      - ../packages/search:/app/packages/search
      - ../packages/search2:/app/packages/search2
      - /app/packages/shared/node_modules
      - /app/packages/db/node_modules
      - /app/packages/search/node_modules
      - /app/packages/search2/node_modules
    healthcheck:
      test: [ "CMD", "sh", "-c", "test -f /app/packages/shared/dist/index.js && test -f /app/packages/db/dist/index.js && test -f /app/packages/search/dist/index.js && test -f /app/packages/search2/dist/index.js" ]
      interval: 2s
      timeout: 2s
      retries: 30

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: hm-api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CACHE_MAX_ENTRIES: ${CACHE_MAX_ENTRIES:-1000}
      REQUEST_METRICS_RETENTION_DAYS: ${REQUEST_METRICS_RETENTION_DAYS:-14}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # :- not just ${VAR} — an unset OR empty .env value must fall back to the
      # service name, otherwise it sails past packages/db's `??` fallback (which
      # only catches null/undefined, not "") and tries to connect to host "".
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: 5432
      OPENSEARCH_HOST: ${OPENSEARCH_HOST:-opensearch}
      OPENSEARCH_PORT: 9200
      # Dev only — no docker-compose.prod.yml `meilisearch` service, so prod
      # never sets this. health.service.ts skips the Meilisearch check
      # entirely when it's unset, instead of reporting a false error.
      MEILISEARCH_HOST: ${MEILISEARCH_HOST:-meilisearch}
      MEILISEARCH_PORT: 7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      libs:
        condition: service_healthy
    ports:
      - "3001:3001"
      - "9229:9229"  # Node inspector — for WebStorm Debug "Attach to Node.js/Chrome"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ../apps/api:/app/apps/api
      - ../packages/db:/app/packages/db
      - ../packages/search:/app/packages/search
      - ../packages/search2:/app/packages/search2
      - ../packages/shared:/app/packages/shared
      - /app/apps/api/node_modules
      - /app/packages/db/node_modules
      - /app/packages/search/node_modules
      - /app/packages/search2/node_modules
      - /app/packages/shared/node_modules

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: hm-web
    restart: unless-stopped
    environment:
      # Browser-visible (client-side polling hits this directly) — see
      # apps/web/RULES.md #11, links/urls stay in env vars, never hardcoded.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    depends_on:
      api:
        condition: service_started
      libs:
        condition: service_healthy
    ports:
      - "3000:3000"
      - "9230:9230"  # Node inspector — the `next dev` CLI process itself, not where page code runs
      - "9231:9231"  # Node inspector — Turbopack's render worker, bumped +1 from 9230 by Next.js
                     # itself to avoid clashing with the parent. Attach WebStorm here, not 9230 —
                     # see "Debugger port: ####" in `docker compose logs web` if this ever drifts.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ../apps/web:/app/apps/web
      - ../packages/shared:/app/packages/shared
      - /app/apps/web/node_modules
      - /app/apps/web/.next
      - /app/packages/shared/node_modules

  postgres:
    image: postgres:18
    container_name: hm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:3.8.0
    container_name: hm-opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=${OPENSEARCH_SECURITY_DISABLED:-true}
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
      - "9600:9600"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - os-data:/usr/share/opensearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10

  # Dev-only for now — no docker-compose.prod.yml entry, nothing in apps/api
  # or apps/web talks to this yet. See infra/README.md.
  meilisearch:
    image: getmeili/meilisearch:v1.53.2
    container_name: hm-meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "${MEILISEARCH_PORT:-7701}:7700"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:7700/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Optional local-only DB admin UIs, see infra/README.md#db-web-uis ---
  # Not started by `docker compose up`. Start explicitly with:
  #   docker compose --profile tools up -d
  dbgate:
    image: dbgate/dbgate:7.2.6
    container_name: hm-tool-dbgate
    restart: unless-stopped
    profiles: [ "tools" ]
    environment:
      CONNECTIONS: postgres
      LABEL_postgres: HeritageMonitor Postgres
      SERVER_postgres: postgres
      PORT_postgres: 5432
      USER_postgres: ${POSTGRES_USER}
      PASSWORD_postgres: ${POSTGRES_PASSWORD}
      DATABASE_postgres: ${POSTGRES_DB}
      ENGINE_postgres: postgres@dbgate-plugin-postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5600:3000"
    volumes:
      - dbgate-data:/root/.dbgate

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.8.0
    container_name: hm-tool-opensearch-dashboards
    restart: unless-stopped
    profiles: [ "tools" ]
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      # OpenSearch itself runs with plugins.security.disabled=true (see the
      # opensearch service above) — Dashboards' own security plugin must be
      # disabled to match, or it tries to talk https/auth to a plain-http node.
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    depends_on:
      opensearch:
        condition: service_healthy
    ports:
      - "5601:5601"

volumes:
  pg-data:
  os-data:
  meili-data:
  dbgate-data: