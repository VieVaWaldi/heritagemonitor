# Standalone prod file, deliberately NOT merged with docker-compose.yml via
# Compose's override mechanism — overrides merge lists like `volumes:` by
# concatenation, so cleanly *removing* the dev bind mounts here isn't simple
# without newer merge-tag syntax. Easier to read top-to-bottom on its own.
#
# Run with:
#   docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod up -d --build
#
# No bind mounts anywhere in this file, app code and the Caddyfile 
# are baked into images at build time (see infra/PRODUCTION.md for why).
# No `libs` service either, each Dockerfile.prod compiles shared/db/search
# itself as part of its own build.

name: heritagemonitor-prod

services:
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: hm-caddy
    restart: unless-stopped
    mem_limit: 128m
    environment:
      # Docker's client-side proxy config (~/.docker/config.json, needed for
      # `corepack`/`pnpm install` during builds) auto-injects these into every
      # *running* container by default too, not just build-time — blank them
      # explicitly so prod containers never silently carry a proxy meant only
      # for pulling/building. See infra/PRODUCTION.md.
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      NO_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      no_proxy: ""
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_started
    ports:
      - "8080:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile.prod
    container_name: hm-web
    restart: unless-stopped
    mem_limit: 768m
    cpus: 2
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      NO_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      no_proxy: ""
    depends_on:
      api:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile.prod
    container_name: hm-api
    restart: unless-stopped
    mem_limit: 1g
    cpus: 2
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CACHE_MAX_ENTRIES: ${CACHE_MAX_ENTRIES:-1000}
      REQUEST_METRICS_RETENTION_DAYS: ${REQUEST_METRICS_RETENTION_DAYS:-14}
      # Keeps Node's own GC well under this container's 1g mem_limit instead
      # of finding out the hard way via an OOM-kill under load.
      NODE_OPTIONS: --max-old-space-size=768
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: 9200
      OPENSEARCH_USERNAME: admin
      OPENSEARCH_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
      # No MEILISEARCH_HOST here deliberately — Meilisearch is dev-only (see
      # infra/README.md), no service defined below. health.service.ts skips
      # the Meilisearch check when this is unset, rather than reporting a
      # false error for a container that was never meant to exist in prod.
      # Defensive, not load-bearing — real browser traffic reaches api through
      # Caddy same-origin, so CORS never actually gets exercised in prod. Kept
      # for any direct/non-proxied access (a local script, debugging).
      CORS_ORIGIN: ${CORS_ORIGIN:-https://heritagemonitor.org}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      NO_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      no_proxy: ""
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:18
    container_name: hm-postgres
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      NO_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      no_proxy: ""
    ports:
      # Loopback only — for host-side `drizzle-kit migrate` (see
      # packages/db/drizzle.config.ts) and an SSH tunnel for admin access.
      # Never reachable from outside this VM, unlike old prod's Postgres.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - pg-data-prod:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:3.8.0
    container_name: hm-opensearch
    restart: unless-stopped
    # 12g heap + 12g headroom *inside this container's own cgroup* — under
    # cgroup v2, page cache for files this container reads is charged to its
    # own memory.max, not some free-floating host pool, so the container
    # needs real room above the heap for Lucene's page cache to live in. See
    # infra/README.md's Prod section for the full cgroup v2 reasoning (this
    # number was originally guessed at 14g and corrected after checking it).
    mem_limit: 24g
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=false
      # UNVERIFIED as of writing — intent is auth required, but no TLS
      # complexity for what's purely an internal Docker-network hop anyway
      # (Caddy/the Omni Proxy already handle real external TLS). Confirm this
      # setting actually does that once tested; if OpenSearch still serves
      # HTTPS with a self-signed demo cert despite this, packages/search's
      # client and the healthcheck below both need to switch to https:// +
      # rejectUnauthorized:false instead.
      - plugins.security.ssl.http.enabled=false
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
      - "OPENSEARCH_JAVA_OPTS=-Xms12g -Xmx12g"
      - bootstrap.memory_lock=true
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - NO_PROXY=
      - http_proxy=
      - https_proxy=
      - no_proxy=
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      # Loopback only — same reasoning as postgres above.
      - "127.0.0.1:${OPENSEARCH_PORT:-9200}:9200"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - os-data-prod:/usr/share/opensearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf -u admin:${OPENSEARCH_INITIAL_ADMIN_PASSWORD} http://localhost:9200/_cluster/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  # Distinct names from dev's pg-data/os-data — this VM only ever runs one of
  # dev or prod at a time in practice, but distinct volumes mean a stray dev
  # run here could never accidentally read or clobber prod's real data.
  pg-data-prod:
  os-data-prod:
